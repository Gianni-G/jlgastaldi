# BibTeX bibliographies (jekyll-scholar).
# One .bib file per bibliography under _bibliography/, selected in a page with
# {% bibliography --file <name> %}. Default locale is English; an individual
# entry renders in another language by carrying a `language` field, e.g.
# `language = {fr}`.
scholar:
  source: ./_bibliography
  bibliography: references.bib
  style: apa
  locale: en
  allow_locale_overrides: true
  sort_by: author

